[project]
name = "jevgate"
version = "0.2.0"
description = "A calibrated tool-call safety gate for AI agents, powered by the Jev decision API. Returns probabilities, not just verdicts."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["ai-agents", "safety", "guardrails", "llm", "security", "jev", "typesafe"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["typesafe-sdk>=0.7", "python-dotenv>=1.0"]

[project.urls]
Homepage = "https://github.com/msudipta888/jevgate"
Repository = "https://github.com/msudipta888/jevgate"
Issues = "https://github.com/msudipta888/jevgate/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jevgate"]
